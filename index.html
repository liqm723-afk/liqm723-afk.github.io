<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>liqm723-afk.github.io</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #ffe353;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #717171;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 40px 20px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #f89138;
            padding: 4px;
            margin-bottom: 24px;
            transition: transform 0.5s ease;
        }

        .avatar:hover {
            transform: rotate(360deg);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #fff0dc;
            font-size: 1.1rem;
            margin-bottom: 32px;
            min-height: 1.5em;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .link-card:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        /* 打字机光标动画 */
        .cursor {
            display: inline-block;
            width: 2px;
            background-color: var(--accent);
            margin-left: 4px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 自动获取你的 GitHub 头像 -->
        <img class="avatar" src="https://avatars.githubusercontent.com/u/239731438?v=4&size=64" alt="Avatar">
        
        <!-- 标题已修改为你的主页域名 -->
        <h1>非标程序员</h1>
        
        <!-- 动态打字简介 -->
        <div class="subtitle">
            <span id="typed-text"></span><span class="cursor">&nbsp;</span>
        </div>
        
        <!-- 个人链接导航 -->
        <div class="links">
            <a href="https://github.com" class="link-card" target="_blank">访问我的 GitHub 仓库</a>
            <a href="https://liqm723-afk.github.io/liqm723-afk/" class="link-card">个人博客</a>
            <a href="mailto:liqm723@mail.com" class="link-card">联系我</a>
        </div>
    </div>

    <script>
      // 专为10年+全栈架构师定制的务实描述
      const phrases = [
          "欢迎来到我的个人主页",
          "10年+全栈开发，专注高并发、高可用系统架构落地",
          "打通前后端全链路，具备从 0 到 1 架构设计与闭环交付能力",
          "聚焦复杂业务攻坚，用工程化思维和务实方案解决核心痛点"
      ];

        let i = 0, j = 0, currentPhrase = [], isDeleting = false;
        const textEl = document.getElementById('typed-text');

        function loop() {
            textEl.innerHTML = currentPhrase.join('');
            if (i < phrases.length) {
                if (!isDeleting && j <= phrases[i].length) {
                    currentPhrase.push(phrases[i][j]);
                    j++;
                }
                if (isDeleting && j <= phrases[i].length) {
                    currentPhrase.pop();
                    j--;
                }
                if (j == phrases[i].length) {
                    isDeleting = true;
                    setTimeout(loop, 2000); // 文字打完后停留 2 秒
                    return;
                }
                if (isDeleting && j == 0) {
                    currentPhrase = [];
                    isDeleting = false;
                    i++;
                    if (i == phrases.length) i = 0;
                }
            }
            setTimeout(loop, isDeleting ? 40 : 100); // 打字速度 100ms，删除速度 40ms
        }
        loop();
    </script>
</body>
</html>
